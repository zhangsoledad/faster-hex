name: Repeat 4 KiB timings with identical-binary controls
on:
  push:
    branches: [zhangsoledad/verify-2.1-cpuid]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.95.0
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
jobs:
  repeat:
    name: ${{ matrix.os }} / sample ${{ matrix.replica }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, replica: 1}
          - {os: ubuntu-24.04, replica: 2}
          - {os: ubuntu-24.04, replica: 3}
          - {os: ubuntu-22.04, replica: 1}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - run: python3 .github/release-timing/repeat.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: repeat-${{ matrix.os }}-${{ matrix.replica }}
          path: release-report/*.json
          retention-days: 3

name: Recheck released ARM hex checking callers
on:
  push:
    branches: [zhangsoledad/verify-2.1-arm-check]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.95.0
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_BENCH_LTO: thin
jobs:
  native:
    name: ARM64 ThinLTO / ${{ matrix.replica }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Compare only released faster-hex check callers against 2.0
        run: python3 .github/release-timing/arm_checks.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: arm-check-${{ matrix.replica }}
          path: release-report/*.json
          retention-days: 3

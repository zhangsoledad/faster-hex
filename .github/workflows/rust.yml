name: Recheck native downstream calls against published 2.0.0
on:
  push:
    branches: [zhangsoledad/verify-release-encoding]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  confirm:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        copy: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          run-id: 45378162084
          github-token: ${{ github.token }}
          pattern: binaries-X64-*
          merge-multiple: true
      - run: |
          tar -xzf default.tgz
          tar -xzf thin.tgz
          python3 .github/release-verify/confirm_release.py
        env:
          REPLICA: ${{ matrix.copy }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: checked-${{ matrix.os }}-${{ matrix.copy }}
          path: |
            cross-results/host.txt
            cross-results/**/*.json
            cross-results/**/*-symbols.txt
          retention-days: 3

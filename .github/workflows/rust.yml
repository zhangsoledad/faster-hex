name: Check 2.1 release encoding on Xeon 8573C
on:
  push:
    branches: [zhangsoledad/verify-2.1-final]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        worker: [1, 2, 3]
    steps:
      - id: cpu
        name: Select the original CPU model
        run: |
          model=$(LC_ALL=C lscpu | sed -n 's/^Model name:[[:space:]]*//p')
          echo "$model"
          if [[ "$model" == *8573C* ]]; then
            echo 'matched=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.cpu.outputs.matched == 'true'
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        if: steps.cpu.outputs.matched == 'true'
        with:
          run-id: 45424523993
          github-token: ${{ github.token }}
          name: binaries-X64-thin
      - if: steps.cpu.outputs.matched == 'true'
        name: Compare identical launch paths for the 2.0.0 and 2.1.0 applications
        run: |
          tar -xzf thin.tgz
          python3 .github/release-verify/xeon-release.py
        env:
          REPLICA: ${{ matrix.worker }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.cpu.outputs.matched == 'true'
        with:
          name: xeon-${{ matrix.os }}-${{ matrix.worker }}
          path: |
            samples/host.txt
            samples/*.json
          retention-days: 3

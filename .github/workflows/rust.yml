name: Validate errors on native ARM
on:
  push:
    branches: [zhangsoledad/2.1-arm-validation]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: {replica: [1, 2]}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {fetch-depth: 0, persist-credentials: false}
    - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
      with: {toolchain: 1.95.0}
    - run: python3 .github/arm-validation.py ${{ matrix.replica }}
      env: {RUSTUP_TOOLCHAIN: 1.95.0, CARGO_INCREMENTAL: '0'}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: arm-results-${{ matrix.replica }}
        path: results
        retention-days: 3

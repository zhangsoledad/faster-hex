name: Compare published 2.0.0 with PR 77 in downstream callers
on:
  push:
    branches: [zhangsoledad/verify-published-callers]
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.95.0
  CARGO_INCREMENTAL: '0'
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
        profile: [default, thin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: nervosnetwork/ckb, ref: 2061bc092a5dd447a741fad03b02628203b35e96, path: ckb, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: GitoxideLabs/gitoxide, ref: a7e739482cd6fe357ca8ebdbf82da5f1945e3e38, path: gitoxide, persist-credentials: false}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: {toolchain: 1.95.0}
      - run: python3 .github/release-verify/build.py ${{ matrix.profile }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binaries-${{ runner.arch }}-${{ matrix.profile }}
          path: ${{ matrix.profile }}.tgz
          compression-level: 0
          retention-days: 1
  measure:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
        copy: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-${{ runner.arch }}-*
          merge-multiple: true
      - run: |
          tar -xzf default.tgz
          tar -xzf thin.tgz
          mkdir -p release-data
          lscpu > release-data/host.txt
          python3 .github/release-verify/measure.py native
        env:
          REPLICA: ${{ matrix.copy }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: published-${{ matrix.os }}-${{ matrix.copy }}
          path: release-data
          retention-days: 3
